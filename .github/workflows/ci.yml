name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Installs devDependencies and runs `prepare`, which emits lib/.
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm test
